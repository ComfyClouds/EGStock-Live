<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economic Group — Request Sent</title>
  <meta name="description" content="Your account request has been received.">
  <meta name="theme-color" content="#0A2647">
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/images/brand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/account.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div class="account-page">
    <div class="account-topbar">
      <a href="../index.html" class="brand" aria-label="Economic Group — Home">
        <span class="brand-mark">
          <img src="../assets/images/brand/eg-icon-white.png" alt="" width="43" height="44">
        </span>
        <span>Economic Group</span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language switcher">
        <button type="button" class="lang-option" data-lang-option="ar" aria-pressed="false">AR</button>
        <button type="button" class="lang-option" data-lang-option="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <main class="account-main">
      <div class="card account-card is-success" role="status">
        <span class="account-success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </span>
        <div class="account-card-header">
          <h1 class="account-card-title" data-i18n="thank_you.title">Your Request Has Been Sent</h1>
          <p class="account-card-subtitle" data-i18n="thank_you.message">Thank you — one of our operations team will contact you within the next 5 business days.</p>
        </div>
        <a href="../index.html" class="btn btn-primary" data-i18n="thank_you.back_home">Back to Home</a>
      </div>
    </main>

    <div class="account-footer">
      <p>&copy; <span id="footer-year"></span> Economic Group. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/pageChrome.js"></script>
  <script>
    window.StockPageChrome.init('../');
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
