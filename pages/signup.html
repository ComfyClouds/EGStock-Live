<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economic Group — Open a Trading Account</title>
  <meta name="description" content="Register for an Economic Group trading account — our operations team will contact you within 5 business days.">
  <meta name="theme-color" content="#0A2647">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/png" href="../assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="../assets/images/brand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/contact.css">
  <link rel="stylesheet" href="../assets/css/account.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div class="account-page">
    <div class="account-topbar">
      <a href="./" class="brand" aria-label="Economic Group — Home">
        <span class="brand-mark">
          <img src="../assets/images/brand/eg-icon-white.png" alt="" width="43" height="44">
        </span>
        <span>Economic Group</span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language switcher">
        <button type="button" class="lang-option" data-lang-option="ar" aria-pressed="false">AR</button>
        <button type="button" class="lang-option" data-lang-option="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <main class="account-main">
      <div class="card account-card">
        <div class="account-card-header">
          <h1 class="account-card-title" data-i18n="account.title">Open a Trading Account</h1>
          <p class="account-card-subtitle" data-i18n="account.subtitle">Fill in your details below and our operations team will take it from there.</p>
        </div>

        <form class="account-form" id="signup-form" novalidate aria-label="Account registration form">
          <div class="form-field">
            <label class="form-label" for="signup-name" data-i18n="account.name">Full Name <span class="required">*</span></label>
            <input type="text" id="signup-name" class="form-input" required autocomplete="name">
            <span class="form-error-msg" role="alert"></span>
          </div>

          <div class="form-field">
            <label class="form-label" for="signup-email" data-i18n="account.email">Email Address <span class="required">*</span></label>
            <input type="email" id="signup-email" class="form-input" required autocomplete="email">
            <span class="form-error-msg" role="alert"></span>
          </div>

          <div class="form-field">
            <label class="form-label" for="signup-phone" data-i18n="account.phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="signup-phone" class="form-input" required autocomplete="tel">
            <span class="form-error-msg" role="alert"></span>
          </div>

          <div class="form-field">
            <label class="form-label" for="signup-address" data-i18n="account.address">Address <span class="required">*</span></label>
            <textarea id="signup-address" class="form-textarea" required autocomplete="street-address" style="min-height:80px;"></textarea>
            <span class="form-error-msg" role="alert"></span>
          </div>

          <div class="form-submit-row">
            <button type="submit" class="btn btn-primary" data-i18n="account.submit">Register</button>
            <span class="form-status" id="signup-form-status" role="status" aria-live="polite"></span>
          </div>
        </form>
      </div>
    </main>

    <div class="account-footer">
      <p>&copy; <span id="footer-year"></span> Economic Group. <span data-i18n="footer.rights">All rights reserved.</span></p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/sheetsApi.js"></script>
  <script src="../assets/js/pageChrome.js"></script>
  <script src="../assets/js/signup.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
