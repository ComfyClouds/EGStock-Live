<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economic Group — Growth Is Our Target</title>
  <meta name="description" content="Trade Egyptian and global markets with Economic Group — a fast, transparent, and secure brokerage platform.">
  <meta name="theme-color" content="#0A2647">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.eg-broktrade.com/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Economic Group">
  <meta property="og:description" content="Trade Egyptian and global markets with Economic Group — a fast, transparent, and secure brokerage platform.">
  <meta property="og:url" content="https://www.eg-broktrade.com/">
  <meta property="og:site_name" content="Economic Group">
  <meta property="og:image" content="assets/images/og-cover.jpg">
  <meta property="og:locale" content="ar_EG">
  <meta property="og:locale:alternate" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Economic Group">
  <meta name="twitter:description" content="Trade Egyptian and global markets with Economic Group — a fast, transparent, and secure brokerage platform.">
  <meta name="twitter:image" content="assets/images/og-cover.jpg">

  <link rel="icon" type="image/png" href="assets/icons/favicon.png">
  <link rel="apple-touch-icon" href="assets/images/brand/favicon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Design System -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/hero.css">
  <link rel="stylesheet" href="assets/css/news.css">
  <link rel="stylesheet" href="assets/css/footer.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <!-- Schema.org -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FinancialService",
    "name": "Economic Group",
    "alternateName": "المجموعة الاقتصادية",
    "description": "Economic Group — a bilingual stock trading and brokerage platform. Growth is our target.",
    "url": "https://www.eg-broktrade.com/",
    "areaServed": "EG",
    "availableLanguage": ["ar", "en"]
  }
  </script>
</head>
<body id="top" data-page="home">
  <a href="#main-content" class="skip-link" data-i18n="common.back_to_top">Skip to content</a>

  <div id="header-mount"></div>

  <main id="main-content">

    <!-- ============ HERO ============ -->
    <section class="hero" data-surface="dark" aria-label="Hero">
      <div class="container hero-inner">
        <div class="hero-slides-wrap">
          <div class="hero-slides" id="hero-slides">
            <!-- Populated dynamically by hero.js from the Sliders sheet -->
          </div>
          <div class="hero-dots" id="hero-dots"></div>
        </div>

        <div class="hero-panel glass reveal">
          <div class="hero-panel-header">
            <span class="hero-panel-title" data-i18n="hero.panel_title">Live Snapshot</span>
            <span class="hero-status">
              <span class="status-dot" id="hero-status-dot"></span>
              <span id="hero-status-label">—</span>
            </span>
          </div>
          <div class="hero-tv-widget" id="hero-tv-widget" aria-live="polite">
            <!-- Populated dynamically by tradingViewWidgets.js (Symbol Overview widget) -->
          </div>
        </div>
      </div>

      <div class="ticker-bar">
        <div class="ticker-track" id="ticker-track">
          <!-- Populated dynamically by hero.js from the Announcements sheet -->
        </div>
      </div>
    </section>

    <!-- ============ PROMO BANNER ============ -->
    <section class="container" style="padding-block: var(--space-7);" aria-label="Promotion">
      <div class="promo-banner" data-surface="dark" data-reveal>
        <div class="promo-banner-text">
          <h3 class="promo-banner-title" data-i18n="hero.cta_primary">Open an Account</h3>
          <p class="promo-banner-subtitle" data-i18n="sections.contact_subtitle">Our team is ready to help you every step of the way.</p>
        </div>
        <div class="promo-banner-cta">
          <a href="pages/signup.html" class="btn btn-primary" data-i18n="nav.open_account">Open Account</a>
        </div>
      </div>
    </section>

    <!-- ============ NEWS ============ -->
    <section class="section" id="news" style="background:var(--color-white);" aria-labelledby="news-title">
      <div class="container">
        <div class="section-header">
          <span class="section-eyebrow" data-i18n="sections.news_eyebrow">Insights</span>
          <h2 class="section-title" id="news-title" data-i18n="sections.news_title">Latest News</h2>
          <p class="section-subtitle" data-i18n="sections.news_subtitle">Stay ahead with market-moving news and analysis.</p>
        </div>

        <div class="news-grid" id="news-grid" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <div id="footer-mount"></div>
  <div id="news-modal-mount"></div>

  <button type="button" class="btn-icon" id="back-to-top" aria-label="Back to top" data-i18n-aria-label="common.back_to_top"
    style="position:fixed; bottom:24px; inset-inline-end:24px; z-index:var(--z-toast); background:var(--color-dark); color:#fff; opacity:0; visibility:hidden; transition: opacity var(--dur-base) var(--ease-out), visibility var(--dur-base); box-shadow:var(--shadow-lg);">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
  </button>

  <style>
    #back-to-top.is-visible { opacity: 1; visibility: visible; }
  </style>

  <!-- Config & Utilities -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/sheetsApi.js"></script>
  <script src="assets/js/skeleton.js"></script>
  <script src="assets/js/lazyload.js"></script>
  <script src="assets/js/partials.js"></script>

  <!-- Components -->
  <script src="components/newsCard.js"></script>
  <script src="components/miniTickerCard.js"></script>
  <script src="components/faqItem.js"></script>

  <!-- Section Modules -->
  <script src="assets/js/header.js"></script>
  <script src="assets/js/footer.js"></script>
  <script src="assets/js/hero.js"></script>
  <script src="assets/js/liveMarketData.js"></script>
  <script src="assets/js/tradingViewWidgets.js"></script>
  <script src="assets/js/market.js"></script>
  <script src="assets/js/news.js"></script>
  <script src="assets/js/newsModal.js"></script>
  <script src="assets/js/faq.js"></script>
  <script src="assets/js/contact.js"></script>
  <script src="assets/js/autoRefresh.js"></script>

  <!-- Boot -->
  <script src="assets/js/main.js"></script>
</body>
</html>
